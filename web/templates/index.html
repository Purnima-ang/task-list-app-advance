<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <!-- Card containing the task list form and tasks -->
        <div class="card shadow">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">📝 Task List</h1>

                <!-- Success Message -->
                {% if message %}
                    <div class="alert alert-success" role="alert">
                        {{ message }}
                    </div>
                {% endif %}

                <!-- Task Add Form -->
                <form method="POST" class="d-flex mb-4">
                    <input name="task" class="form-control me-2" type="text" placeholder="Enter new task" required>
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </form>

                <!-- Clear All Tasks Button -->
                <form method="POST" action="/clear" class="mb-4">
                    <button type="submit" class="btn btn-danger w-100">Clear All Tasks</button>
                </form>

                <!-- Current Tasks List -->
                <h4 class="mb-3">Current Tasks:</h4>
                <ul class="list-group">
                    {% for task in tasks %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            {{ task }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
